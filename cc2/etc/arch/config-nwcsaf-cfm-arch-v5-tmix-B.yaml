# EXPERIMENT (temporal consistency, 2026-10): joint decoding (LeadTemporalMixer) fine-tune of trusting-disk 9200.
# Branch temporal-change-loss. ARM B (mixer + change loss). Arms A and B are identical except temporal_change_weight
# (A = 0: mixer only; B > 0: mixer + change loss), so B - A isolates the change loss.
# Both: all-season multi-year data (TD split), lead-correlated training noise rho 0.6 (= inference),
# mixer lr 20 x base (zero-init block). Needs CC2_FIT_STATS_CKPT = TD 9200 and runs/trusting-disk/1/best.ckpt
# -> epoch=19-step=9200 (exists on LUMI). temporal_change_weight 1.0 calibrated on an ewc smoke run 2026-10-29
# (TD 9200 weights: change loss = ~14 % of the total train loss, ~19 % of val loss at full weight).
seed_everything: 42
trainer:
  accelerator: auto
  strategy: ddp_find_unused_parameters_true
  devices: auto
  num_nodes: 12
  precision: bf16-mixed
  logger:
  - class_path: lightning.pytorch.loggers.MLFlowLogger
    init_args:
      experiment_name: cc2-arch-partio
      tracking_uri: https://mlflow.out.ocp.fmi.fi
      log_model: false
      prefix: ''
  callbacks:
  - class_path: lightning.pytorch.callbacks.ModelCheckpoint
    init_args:
      monitor: val_loss
      save_last: true
      save_top_k: 3
      mode: min
  - class_path: lightning.pytorch.callbacks.ModelSummary
    init_args:
      max_depth: 2
  - class_path: callback.callback.CleanupFailedRunCallback
  - class_path: callback.ew_callback.EarlyWarningMetricsCallback
    init_args:
      fss_threshold: 0.5
      fss_radius: 10
      log_train: true
      log_val: true
  - class_path: lightning.pytorch.callbacks.ModelCheckpoint
    init_args:
      monitor: null
      save_top_k: 1
      save_last: false
      filename: latest
      enable_version_counter: false
      every_n_train_steps: 500
  max_epochs: null
  max_steps: 2000
  log_every_n_steps: 100
  accumulate_grad_batches: 1
  val_check_interval: 1.0
  gradient_clip_val: 1.0
  enable_model_summary: false
model:
  class_path: cc2module.cc2module
  init_args:
    history_length: 2
    hidden_dim: 256
    patch_size: 4
    encoder1_depth: 16
    encoder2_depth: 4
    decoder1_depth: 4
    decoder2_depth: 16
    window_size: 6
    window_size_deep: 10
    num_heads: 8
    mlp_ratio: 4.0
    drop_rate: 0.05
    attn_drop_rate: 0.0
    drop_path_rate:
    - 0.05
    - 0.01
    - 0.01
    - 0.15
    learning_rate: 4.35e-06
    warmup_iterations: 200
    weight_decay: 0.05
    rollout_length: 12
    branch_from_run: trusting-disk/1
    use_gradient_checkpointing: true
    model_family: swinu
    use_scheduled_sampling: false
    ss_pred_min: 0.0
    ss_pred_max: 1.0
    freeze_layers: []
    loss_fn:
      class_path: loss.combined.CombinedLoss
      init_args:
        losses:
        - class_path: loss.bce.BCELoss
          init_args:
            use_full_state: true
            eps: 0.0001
        - class_path: loss.softfss.SoftFSSLoss
          init_args:
            thresholds:
            - 0.0625
            - 0.5625
            - 0.9375
            window_sizes:
            - 3
            - 6
            - 12
            tau: 0.015625
            soften_true: false
            threshold_weights:
            - 0.5
            - 0.35
            - 0.15
            scale_weights:
            - 0.5
            - 0.35
            - 0.15
            eps: 1.0e-08
        weights:
        - 1.0
        - 0.2
        ramps: null
        names:
        - bce
        - soft_fss
    test_output_directory: null
    use_rollout_weighting: false
    use_statistics_from_checkpoint: true
    force_frozen_backbone_to_eval: false
    preprocessor: null
    use_flow_matching: true
    num_inference_steps: 16
    flow_init_noise_sigma: 1.0
    flow_eta: 0.05
    direct_prediction: true
    temporal_mixing: 1
    temporal_mixer_lr_mult: 20.0
    flow_train_noise_rho: 0.6
    temporal_change_weight: 1.0
    temporal_change_pool: 8
    temporal_change_ramp_steps: 500
data:
  data_path:
  - ../data/meps-nwcsaf-475x535-2020-2026-v5.zarr
  static_forcing_path: ../data/meps-const-v4.zarr
  prognostic_params:
  - tcc
  forcing_params:
  - insolation
  - cos_julian_day
  - sin_julian_day
  - cos_local_time
  - sin_local_time
  - t_1000
  - t_500
  - t_700
  - t_850
  - t_925
  - u_1000
  - u_500
  - u_700
  - u_850
  - u_925
  - v_1000
  - v_500
  - v_700
  - v_850
  - v_925
  - z_1000
  - z_500
  - z_700
  - z_850
  - z_925
  - r_1000
  - r_500
  - r_700
  - r_850
  - r_925
  static_forcing_params:
  - z
  - lsm
  - cos_latitude
  - sin_latitude
  - cos_longitude
  - sin_longitude
  train_start: '2020-02-06'
  train_end: '2025-07-01'
  val_start: '2025-07-01'
  val_end: '2026-01-01'
  batch_size: 1
  num_workers: 4
  persistent_workers: true
  prefetch_factor: 3
  pin_memory: true
  apply_smoothing: false
  data_options: {}
optimizer: null
lr_scheduler: null
ckpt_path: null
