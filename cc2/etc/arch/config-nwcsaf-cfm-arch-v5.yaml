seed_everything: 42
trainer:
  accelerator: auto
  strategy: ddp_find_unused_parameters_true
  devices: auto
  num_nodes: 12   # cosmetic (see cc2v7.sh); 12 nodes -> eff. batch 96 (one 48 h job). 8 nodes -> 64 (two jobs): then lr 7.0e-06
  precision: bf16-mixed
  logger:
  - class_path: lightning.pytorch.loggers.MLFlowLogger
    init_args:
      experiment_name: cc2-arch-partio
      tracking_uri: https://mlflow.out.ocp.fmi.fi
      log_model: false
      prefix: ''
  callbacks:
  - class_path: lightning.pytorch.callbacks.ModelCheckpoint
    init_args:
      monitor: val_loss
      save_last: true
      save_top_k: 3
      mode: min
  - class_path: lightning.pytorch.callbacks.ModelSummary
    init_args:
      max_depth: 2
  - class_path: callback.callback.CleanupFailedRunCallback
  - class_path: callback.ew_callback.EarlyWarningMetricsCallback
    init_args:
      fss_threshold: 0.5
      fss_radius: 10
      log_train: true
      log_val: true
  - class_path: lightning.pytorch.callbacks.ModelCheckpoint
    init_args:
      monitor: null
      save_top_k: 1
      save_last: false
      filename: latest
      enable_version_counter: false
      every_n_train_steps: 500
  max_epochs: null
  max_steps: 6800   # = budget at eff. batch 96 (~15 passes over ~43k samples; 10100 at batch 64; see tasks/training-spec-v5.md §4). No EarlyStopping: CFM val_loss is blind to sharpening -- cancel on the watcher TURN, pick among 2-3 ckpts by placement/FSS
  log_every_n_steps: 100
  accumulate_grad_batches: 1
  val_check_interval: 0.5   # FLOAT = fraction of an epoch (twice per epoch); an INT would count dataloader batches and skip the epoch-end validation
  gradient_clip_val: 1.0
  enable_model_summary: false

model:
  class_path: cc2module.cc2module
  init_args:
    history_length: 2
    hidden_dim: 256
    patch_size: 4
    encoder1_depth: 16
    encoder2_depth: 4
    decoder1_depth: 4
    decoder2_depth: 16
    window_size: 6
    window_size_deep: 10
    num_heads: 8
    mlp_ratio: 4.0
    drop_rate: 0.05
    attn_drop_rate: 0.0
    drop_path_rate:
    - 0.05
    - 0.01
    - 0.01
    - 0.15
    learning_rate: 8.7e-06   # sqrt scaling from crunchy-kudos's 5e-6 @ batch 32 -> 8.7e-6 @ 96 (7.0e-6 @ 64, 5e-6 @ 32)
    warmup_iterations: 500
    weight_decay: 0.05
    rollout_length: 12
    branch_from_run: CHANGE-ME-stage-C-v5-run/1   # the v5 NWCSAF backbone; point its best.ckpt at the val-minimum checkpoint first
    use_gradient_checkpointing: true
    model_family: swinu
    use_scheduled_sampling: false
    ss_pred_min: 0.0
    ss_pred_max: 1.0
    freeze_layers: []
    loss_fn:
      class_path: loss.combined.CombinedLoss
      init_args:
        losses:
        - class_path: loss.bce.BCELoss
          init_args:
            use_full_state: true
            eps: 0.0001
            straight_through_clamp: false   # set true ONLY if the stage-D clamp probe (2026-10-07) shows >= 0.005 on the clear-regime t+1 mean
        - class_path: loss.softfss.SoftFSSLoss
          init_args:
            thresholds:
            - 0.0625
            - 0.5625
            - 0.9375
            window_sizes:
            - 3
            - 6
            - 12
            tau: 0.015625
            soften_true: false
            threshold_weights:
            - 0.5
            - 0.35
            - 0.15
            scale_weights:
            - 0.5
            - 0.35
            - 0.15
            eps: 1.0e-08
        weights:
        - 1.0
        - 0.2
        ramps: null
        names:
        - bce
        - soft_fss
    test_output_directory: null
    use_rollout_weighting: false
    use_statistics_from_checkpoint: true
    force_frozen_backbone_to_eval: false
    preprocessor: null
    use_flow_matching: true
    num_inference_steps: 16
    flow_init_noise_sigma: 1.0
    flow_eta: 0.05
    direct_prediction: true

data:
  data_path:
  - ../data/meps-nwcsaf-475x535-2018-2026-v5.zarr   # v5: homogeneous nearest-neighbour tcc, point-registered (reproject_v2)
  static_forcing_path: ../data/meps-const-v4.zarr
  prognostic_params:
  - tcc
  forcing_params:
  - insolation
  - cos_julian_day
  - sin_julian_day
  - cos_local_time
  - sin_local_time
  - t_1000
  - t_500
  - t_700
  - t_850
  - t_925
  - u_1000
  - u_500
  - u_700
  - u_850
  - u_925
  - v_1000
  - v_500
  - v_700
  - v_850
  - v_925
  - z_1000
  - z_500
  - z_700
  - z_850
  - z_925
  - r_1000
  - r_500
  - r_700
  - r_850
  - r_925
  static_forcing_params:
  - z
  - lsm
  - cos_latitude
  - sin_latitude
  - cos_longitude
  - sin_longitude
  train_start: '2020-02-06'   # first date with MEPS forcing (NWCSAF v5 starts 2018-10, MEPS does not)
  train_end: '2025-07-01'
  val_start: '2025-07-01'     # Jul-Dec 2025 (~4400 samples, summer->winter): monitoring + checkpoint pick ONLY; no EarlyStopping -- Mikko cancels on the watcher TURN
  val_end: '2026-01-01'       # 2026-01-11..09-30 is the RESERVED test, never in a config
  batch_size: 1
  num_workers: 4
  persistent_workers: true
  prefetch_factor: 3
  pin_memory: true
  apply_smoothing: false
  data_options: {}

optimizer: null
lr_scheduler: null
ckpt_path: null
