# STAGE 3/3 of the architecture-fix retrain (2026-09): CFM refinement on the
# fixed-architecture direct-prediction backbone (noisy-buck recipe).
#
# Branches from the stage-2 backbone (config-nwcsaf-backbone-arch.yaml).
# SET branch_from_run TO THE ACTUAL STAGE-2 RUN NAME (its best/val-min version),
# and check the "Weight loading results" log line (strict=False load;
# _extend_proj_force_for_flow zero-extends proj_force for the +2 flow channels).
#
# Differences from the historical config-nwcsaf-cfm-from-3654.yaml:
#   - flow_warm_start / warm_start_alpha removed (deleted from code, 04b0992)
#   - EarlyStopping min_delta 0.001 -> 0.0 (June flag: 0.001 may stop prematurely
#     on the noisier CFM val loss)
#   - normalization override to match the fixed trunk
#
# EVALUATION NOTE: track placement (state-corr@t12 / Lagrangian-MSESS) at EVERY
# checkpoint, not just the last — the CFM sharpening phase transition
# (cfm-s6350/s7325 precedent) is invisible in the loss curve.
seed_everything: 42
trainer:
  accelerator: auto
  strategy: ddp_find_unused_parameters_true
  devices: auto
  num_nodes: 4
  precision: bf16-mixed
  logger:
  - class_path: lightning.pytorch.loggers.MLFlowLogger
    init_args:
      experiment_name: cc2-arch-partio
      tracking_uri: https://mlflow.out.ocp.fmi.fi
      log_model: false
      prefix: ''
  callbacks:
  - class_path: lightning.pytorch.callbacks.ModelCheckpoint
    init_args:
      monitor: val_loss
      save_last: true
      save_top_k: 3
      mode: min
  - class_path: lightning.pytorch.callbacks.ModelSummary
    init_args:
      max_depth: 2
  - class_path: callback.callback.CleanupFailedRunCallback
  - class_path: callback.ew_callback.EarlyWarningMetricsCallback
    init_args:
      fss_threshold: 0.5
      fss_radius: 10
      log_train: true
      log_val: true
  - class_path: lightning.pytorch.callbacks.EarlyStopping
    init_args:
      monitor: val_loss
      mode: min
      patience: 8
      min_delta: 0.0
      check_finite: true
      check_on_train_epoch_end: false
  max_epochs: null
  max_steps: 20000
  limit_val_batches: 0.5
  val_check_interval: 200
  log_every_n_steps: 100
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  enable_model_summary: false

model:
  class_path: cc2module.cc2module
  init_args:
    history_length: 2
    hidden_dim: 256
    patch_size: 4
    encoder1_depth: 16
    encoder2_depth: 4
    decoder1_depth: 4
    decoder2_depth: 16
    window_size: 6
    window_size_deep: 10
    num_heads: 8
    mlp_ratio: 4.0
    drop_rate: 0.05
    attn_drop_rate: 0.0
    drop_path_rate:
    - 0.05
    - 0.01
    - 0.01
    - 0.15
    learning_rate: 5.0e-06
    warmup_iterations: 500
    weight_decay: 0.05
    rollout_length: 12
    # <-- SET to the stage-2 run (config-nwcsaf-backbone-arch.yaml output)
    branch_from_run: CHANGE-ME-nwcsaf-backbone-run/1
    use_gradient_checkpointing: true
    model_family: swinu
    use_scheduled_sampling: false
    ss_pred_min: 0.0
    ss_pred_max: 1.0
    freeze_layers: []
    loss_fn:
      class_path: loss.combined.CombinedLoss
      init_args:
        losses:
        - class_path: loss.bce.BCELoss
          init_args:
            use_full_state: true
            eps: 0.0001
        - class_path: loss.softfss.SoftFSSLoss
          init_args:
            thresholds:
            - 0.0625
            - 0.5625
            - 0.9375
            window_sizes:
            - 3
            - 6
            - 12
            tau: 0.015625
            soften_true: false
            threshold_weights:
            - 0.5
            - 0.35
            - 0.15
            scale_weights:
            - 0.5
            - 0.35
            - 0.15
            eps: 1.0e-08
        weights:
        - 1.0
        - 0.2
        ramps: null
        names:
        - bce
        - soft_fss
    test_output_directory: null
    use_rollout_weighting: false
    use_statistics_from_checkpoint: true
    force_frozen_backbone_to_eval: false
    preprocessor: null
    # --- flow matching ---
    use_flow_matching: true
    # INFERENCE (DDIM) params; training samples alpha~U(0,1) and ignores them.
    # K=16 default here; the decision-protocol K/eta sweep happens at test time.
    num_inference_steps: 16
    flow_init_noise_sigma: 1.0
    flow_eta: 0.05
    direct_prediction: true

data:
  data_path:
  - ../data/meps-nwcsaf-475x535-2020-2025-v4.zarr
  static_forcing_path: ../data/meps-const-v4.zarr
  prognostic_params:
  - tcc
  forcing_params:
  - insolation
  - cos_julian_day
  - sin_julian_day
  - cos_local_time
  - sin_local_time
  - t_1000
  - t_500
  - t_700
  - t_850
  - t_925
  - u_1000
  - u_500
  - u_700
  - u_850
  - u_925
  - v_1000
  - v_500
  - v_700
  - v_850
  - v_925
  - z_1000
  - z_500
  - z_700
  - z_850
  - z_925
  - r_1000
  - r_500
  - r_700
  - r_850
  - r_925
  static_forcing_params:
  - z
  - lsm
  - cos_latitude
  - sin_latitude
  - cos_longitude
  - sin_longitude
  # Held identical to the RC lineage's windows on purpose (vs-RC comparability).
  train_start: '2020-01-01'
  train_end: '2024-01-01'
  val_start: '2024-01-01'
  val_end: '2025-01-01'
  batch_size: 1
  num_workers: 4
  persistent_workers: true
  prefetch_factor: 3
  pin_memory: true
  apply_smoothing: false
  data_options: {}

optimizer: null
lr_scheduler: null
ckpt_path: null
